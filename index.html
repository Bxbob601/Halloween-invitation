<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Midnight Invitation</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=IM+Fell+English+SC&family=UnifrakturCook:wght@700&display=swap');

:root{
  --black:#080708;
  --ink:#141015;
  --paper:#d8c8a8;
  --paper-dark:#a99670;
  --blood:#5d1119;
  --gold:#b89a61;
  --shadow:rgba(0,0,0,.75);
}

*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  background:
    radial-gradient(circle at 50% 45%, #241c22 0%, #100d11 38%, #050506 78%);
  color:#eadfc8;
  font-family:Cinzel,serif;
}

.scene{
  position:relative;
  width:100vw;height:100vh;
  min-height:620px;
  display:grid;
  place-items:center;
  perspective:1400px;
  overflow:hidden;
  isolation:isolate;
}

/* atmospheric layers */
.scene:before{
  content:"";
  position:absolute;inset:-20%;
  background:
    radial-gradient(ellipse at 20% 30%, rgba(105,82,53,.13), transparent 35%),
    radial-gradient(ellipse at 80% 70%, rgba(93,17,25,.10), transparent 30%);
  filter:blur(25px);
  animation: drift 14s ease-in-out infinite alternate;
  z-index:-2;
}
.scene:after{
  content:"";
  position:absolute;inset:0;
  pointer-events:none;
  background:
    repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 4px),
    radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.58) 100%);
  z-index:20;
  mix-blend-mode:screen;
  opacity:.55;
}
@keyframes drift{to{transform:translate3d(3%, -2%,0) scale(1.05)}}

/* floating dust */
.dust,.bat{
  position:absolute;
  pointer-events:none;
  z-index:2;
}
.dust{
  width:2px;height:2px;border-radius:50%;
  background:#cdbb94;
  opacity:.2;
  animation:float 9s linear infinite;
}
@keyframes float{
  from{transform:translateY(40vh) translateX(0);opacity:0}
  20%{opacity:.25}
  80%{opacity:.18}
  to{transform:translateY(-45vh) translateX(70px);opacity:0}
}

/* title */
.prompt{
  position:absolute;
  bottom:7vh;
  text-align:center;
  letter-spacing:.28em;
  font-size:11px;
  text-transform:uppercase;
  color:#c8b997;
  opacity:.78;
  transition:opacity .5s, transform .5s;
  z-index:30;
}
.prompt span{display:block;margin-top:10px;font-family:"IM Fell English SC",serif;font-size:16px;letter-spacing:.12em;color:#8f1621}
.opened .prompt{opacity:0;transform:translateY(12px);pointer-events:none}

/* envelope */
.envelope-wrap{
  width:min(86vw,720px);
  aspect-ratio:1.6/1;
  position:relative;
  transform-style:preserve-3d;
  filter:drop-shadow(0 30px 35px rgba(0,0,0,.75));
  transition:transform 1.2s cubic-bezier(.2,.8,.2,1);
  z-index:10;
}
.envelope-wrap:hover{transform:translateY(-5px) rotateX(1deg)}

.envelope{
  position:absolute;inset:0;
  transform-style:preserve-3d;
}

/* envelope body */
.env-back{
  position:absolute;inset:0;
  background:
    linear-gradient(145deg,#171217,#0b0a0c 55%,#1b1319);
  border:1px solid rgba(185,154,97,.3);
  box-shadow:inset 0 0 0 5px rgba(0,0,0,.35), inset 0 0 50px rgba(0,0,0,.75);
  border-radius:4px;
}
.env-back:after{
  content:"";
  position:absolute;inset:13px;
  border:1px solid rgba(185,154,97,.17);
}

/* envelope triangular folds */
.fold-left,.fold-right,.fold-bottom{
  position:absolute;inset:0;
  overflow:hidden;
  pointer-events:none;
}
.fold-left:before,.fold-right:before,.fold-bottom:before{
  content:"";
  position:absolute;
  width:72%;height:100%;
  top:0;
  background:linear-gradient(145deg,#211922,#0d0b0e);
  border:1px solid rgba(185,154,97,.16);
}
.fold-left:before{left:-28%;transform:skewX(38deg)}
.fold-right:before{right:-28%;transform:skewX(-38deg)}
.fold-bottom:before{
  width:0;height:0;left:0;right:0;margin:auto;
  top:auto;bottom:-1px;
  border-left:50% solid transparent;
  border-right:50% solid transparent;
  border-top:55% solid #121014;
  border-bottom:0;
  transform:none;
}
.fold-bottom{
  clip-path:polygon(0 100%,50% 42%,100% 100%);
}

/* flap */
.flap{
  position:absolute;
  left:0;top:0;width:100%;height:62%;
  transform-origin:50% 0%;
  transform-style:preserve-3d;
  z-index:8;
  transition:transform 1.35s cubic-bezier(.22,.75,.2,1);
}
.flap-front{
  position:absolute;inset:0;
  background:linear-gradient(145deg,#1a141b,#09080a 72%);
  clip-path:polygon(0 0,100% 0,50% 100%);
  border-top:1px solid rgba(185,154,97,.26);
  backface-visibility:hidden;
  box-shadow:0 10px 25px rgba(0,0,0,.3);
}
.flap-front:after{
  content:"";
  position:absolute;
  left:7%;right:7%;top:6%;
  height:1px;background:rgba(185,154,97,.2);
}
.flap-inner{
  position:absolute;inset:0;
  background:linear-gradient(145deg,#251b22,#0c0a0d);
  clip-path:polygon(0 0,100% 0,50% 100%);
  transform:rotateX(180deg);
  backface-visibility:hidden;
}

/* ornate envelope corners */
.ornament{
  position:absolute;width:38px;height:38px;
  border:1px solid rgba(185,154,97,.38);
  opacity:.7;z-index:9;
}
.ornament.tl{top:20px;left:20px;border-right:0;border-bottom:0}
.ornament.tr{top:20px;right:20px;border-left:0;border-bottom:0}
.ornament.bl{bottom:20px;left:20px;border-right:0;border-top:0}
.ornament.br{bottom:20px;right:20px;border-left:0;border-top:0}

/* wax seal */
.seal{
  position:absolute;
  width:92px;height:92px;
  left:50%;top:59%;
  transform:translate(-50%,-50%) translateZ(45px);
  border-radius:50%;
  background:
    radial-gradient(circle at 35% 30%,#9b3336,#63151d 48%,#390b11 100%);
  border:5px double #2b080d;
  box-shadow:
    0 8px 16px rgba(0,0,0,.7),
    inset 0 0 0 4px rgba(179,112,90,.15),
    inset 0 -8px 15px rgba(0,0,0,.28);
  cursor:pointer;
  z-index:15;
  transition:transform .25s, filter .25s, opacity .6s;
}
.seal:hover{
  transform:translate(-50%,-50%) translateZ(55px) scale(1.05) rotate(-2deg);
  filter:brightness(1.15);
}
.seal:before{
  content:"☩";
  position:absolute;inset:0;
  display:grid;place-items:center;
  color:#d4b78b;
  font-size:34px;
  text-shadow:0 2px 2px #30080d;
  font-family:"Times New Roman",serif;
}
.seal:after{
  content:"";
  position:absolute;inset:9px;
  border:1px solid rgba(210,180,130,.35);
  border-radius:50%;
}
.seal.cracked{
  animation:sealBreak .65s forwards;
}
@keyframes sealBreak{
  0%{transform:translate(-50%,-50%) translateZ(45px) scale(1)}
  35%{transform:translate(-50%,-50%) translateZ(55px) scale(1.14) rotate(3deg)}
  100%{transform:translate(-50%,-50%) translateZ(55px) scale(.65);opacity:0;filter:brightness(2)}
}

/* letter */
.letter{
  position:absolute;
  left:8%;right:8%;
  top:15%;height:76%;
  background:
    radial-gradient(circle at 20% 20%,rgba(255,255,255,.14),transparent 25%),
    radial-gradient(circle at 80% 80%,rgba(82,51,30,.16),transparent 35%),
    linear-gradient(135deg,#e3d4b5,#c9b893);
  color:#21171a;
  border:1px solid rgba(73,46,29,.5);
  box-shadow:0 15px 40px rgba(0,0,0,.65);
  transform:translateY(37%) scale(.94);
  opacity:0;
  z-index:5;
  transition:
    transform 1.5s cubic-bezier(.16,.82,.2,1) .55s,
    opacity .7s .45s;
  overflow:hidden;
}
.letter:before{
  content:"";
  position:absolute;inset:14px;
  border:1px solid rgba(62,38,25,.32);
}
.letter:after{
  content:"";
  position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(60,40,25,.025) 4px);
  pointer-events:none;
}
.letter-content{
  position:absolute;inset:10%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;
  z-index:2;
}
.kicker{
  font-family:"IM Fell English SC",serif;
  letter-spacing:.2em;
  font-size:clamp(10px,1.4vw,15px);
}
.title{
  font-family:"UnifrakturCook",serif;
  font-size:clamp(42px,7vw,78px);
  line-height:.9;
  margin:12px 0;
  color:#25171a;
}
.rule{
  width:55%;height:1px;background:#6c4c37;margin:8px 0 16px;
}
.fake-info{
  font-family:"IM Fell English SC",serif;
  font-size:clamp(14px,2vw,20px);
  line-height:1.7;
}
.crest{
  font-size:30px;margin-bottom:10px;
}

/* opened state */
.opened .flap{transform:rotateX(178deg)}
.opened .seal{pointer-events:none}
.opened .letter{
  transform:translateY(-7%) scale(1);
  opacity:1;
  z-index:12;
}
.opened .envelope-wrap{
  transform:translateY(8vh) scale(.98);
}
.opened .env-back,
.opened .fold-left,
.opened .fold-right,
.opened .fold-bottom{filter:brightness(.8)}

/* reset button */
.reset{
  position:absolute;top:24px;right:24px;
  background:transparent;color:#a99a7d;
  border:1px solid rgba(185,154,97,.25);
  padding:8px 12px;
  font:10px Cinzel,serif;
  letter-spacing:.15em;
  text-transform:uppercase;
  opacity:0;
  pointer-events:none;
  transition:.4s;
  cursor:pointer;
  z-index:40;
}
.opened .reset{opacity:.8;pointer-events:auto}
.reset:hover{opacity:1;border-color:rgba(185,154,97,.6)}

@media(max-width:600px){
  .scene{min-height:0}
  .envelope-wrap{width:92vw}
  .seal{width:76px;height:76px}
  .seal:before{font-size:28px}
  .letter{left:4%;right:4%;top:12%;height:78%}
  .letter-content{inset:12% 8%}
  .ornament{width:26px;height:26px}
}
</style>
</head>
<body>
<main class="scene" id="scene">
  <i class="dust" style="left:12%;top:70%;animation-delay:-2s"></i>
  <i class="dust" style="left:23%;top:60%;animation-delay:-5s"></i>
  <i class="dust" style="left:72%;top:75%;animation-delay:-1s"></i>
  <i class="dust" style="left:84%;top:50%;animation-delay:-7s"></i>
  <i class="dust" style="left:60%;top:25%;animation-delay:-4s"></i>

  <section class="envelope-wrap" aria-label="Halloween invitation envelope">
    <div class="envelope">
      <div class="env-back"></div>
      <div class="fold-left"></div>
      <div class="fold-right"></div>
      <div class="fold-bottom"></div>

      <div class="letter">
        <div class="letter-content">
          <div class="crest">✦</div>
          <div class="kicker">By candlelight, you are summoned to</div>
          <div class="title">A Night of Mystery</div>
          <div class="rule"></div>
          <div class="fake-info">
            A Halloween Dinner<br>
            All Hallows' Eve · Seven in the Evening<br>
            Somewhere delightfully sinister
          </div>
          <div class="rule"></div>
          <div class="kicker">Dress in your darkest finery</div>
        </div>
      </div>

      <div class="flap">
        <div class="flap-front"></div>
        <div class="flap-inner"></div>
      </div>

      <div class="ornament tl"></div>
      <div class="ornament tr"></div>
      <div class="ornament bl"></div>
      <div class="ornament br"></div>

      <button class="seal" id="seal" aria-label="Break the wax seal"></button>
    </div>
  </section>

  <div class="prompt">
    <div>Break the seal</div>
    <span>to enter</span>
  </div>

  <button class="reset" id="reset">Close envelope</button>
</main>

<script>
const scene = document.getElementById('scene');
const seal = document.getElementById('seal');
const reset = document.getElementById('reset');

seal.addEventListener('click', () => {
  if (scene.classList.contains('opened')) return;
  seal.classList.add('cracked');
  setTimeout(() => scene.classList.add('opened'), 220);
});

reset.addEventListener('click', () => {
  scene.classList.remove('opened');
  setTimeout(() => seal.classList.remove('cracked'), 700);
});
</script>
</body>
</html>
